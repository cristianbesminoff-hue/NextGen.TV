<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextGen TV - Player Web</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col p-4 selection:bg-blue-600 selection:text-white">

    <div class="max-w-6xl mx-auto w-full space-y-6 flex-1 flex flex-col">
        
        <!-- Cabeçalho do Player -->
        <div class="flex justify-between items-center bg-zinc-950 border border-zinc-800 p-4 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-xl font-extrabold text-blue-500">NextGen TV Player</h1>
                <p id="infoUtilizador" class="text-xs text-zinc-400">A carregar dados da conta...</p>
            </div>
            <button onclick="sairPlayer()" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white border border-red-600/30 px-4 py-2 rounded-xl text-xs font-semibold transition">
                Sair / Trocar Conta
            </button>
        </div>

        <!-- Conteúdo Principal / Categorias e Listas -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 flex-1">
            <!-- Sidebar de Categorias -->
            <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-2 max-h-[70vh] overflow-y-auto">
                <h2 class="text-sm font-bold text-zinc-300 uppercase tracking-wider mb-3">Categorias</h2>
                <div id="listaCategorias" class="space-y-1">
                    <p class="text-xs text-zinc-500">A carregar categorias...</p>
                </div>
            </div>

            <!-- Área de Exibição / Streams -->
            <div class="md:col-span-3 bg-zinc-950 border border-zinc-800 rounded-2xl p-6 flex flex-col justify-center items-center text-center space-y-4">
                <div id="playerContainer" class="w-full h-full flex flex-col items-center justify-center space-y-3">
                    <div class="text-blue-500 text-5xl">📺</div>
                    <h3 class="text-lg font-bold text-white">Selecione uma categoria e um canal</h3>
                    <p class="text-sm text-zinc-400 max-w-md">Escolha uma opção na barra lateral para começar a reproduzir o conteúdo na sua tela.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Script de Gestão do Player com Proxy Alternativo Atualizado -->
    <script>
        const urlServidor = "http://plus.lat";
        
        const username = localStorage.getItem('iptv_user') || "89912879";
        const password = localStorage.getItem('iptv_pass') || "472591581";

        document.getElementById('infoUtilizador').innerText = `Utilizador: ${username}`;

        async function fetchIptvApi(action, extraParams = '') {
            let apiOriginal = `${urlServidor}/player_api.php?username=${username}&password=${password}&action=${action}${extraParams}`;
            
            // Utilizando o proxy corsh.io alternativo para evitar quedas de DNS
            const urlSegura = `https://proxy.cors.sh/${apiOriginal}`;

            try {
                const response = await fetch(urlSegura, {
                    headers: {
                        'x-requested-with': 'xmlhttprequest'
                    }
                });
                
                if (!response.ok) throw new Error('Erro na resposta do servidor');
                
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Erro ao buscar dados da API:", error);
                throw error;
            }
        }

        async function initApp() {
            try {
                const categorias = await fetchIptvApi('get_live_categories');
                const containerCategorias = document.getElementById('listaCategorias');
                containerCategorias.innerHTML = '';

                if (Array.isArray(categorias)) {
                    categorias.forEach(cat => {
                        const btn = document.createElement('button');
                        btn.className = "w-full text-left px-3 py-2 rounded-xl text-xs text-zinc-300 hover:bg-blue-600 hover:text-white transition font-medium truncate";
                        btn.innerText = cat.category_name;
                        btn.onclick = () => carregarCanaisCategoria(cat.category_id, cat.category_name);
                        containerCategorias.appendChild(btn);
                    });
                } else {
                    containerCategorias.innerHTML = `<p class="text-xs text-red-500">Erro ao carregar categorias.</p>`;
                }
            } catch (e) {
                document.getElementById('listaCategorias').innerHTML = `<p class="text-xs text-red-500">Falha de ligação ao servidor.</p>`;
            }
        }

        async function carregarCanaisCategoria(categoryId, categoryName) {
            const container = document.getElementById('playerContainer');
            container.innerHTML = `<p class="text-sm text-zinc-400">A carregar canais de ${categoryName}...</p>`;

            try {
                const canais = await fetchIptvApi('get_live_streams', `&category_id=${categoryId}`);
                
                if (Array.isArray(canais) && canais.length > 0) {
                    container.innerHTML = `
                        <h3 class="text-md font-bold text-blue-400">${categoryName} (${canais.length} canais)</h3>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 w-full max-h-96 overflow-y-auto p-2">
                            ${canais.map(canal => `
                                <div onclick="reproduzirCanal('${canal.stream_id}', '${canal.name}')" class="bg-zinc-900 border border-zinc-800 p-3 rounded-xl hover:border-blue-500 cursor-pointer transition text-left flex items-center gap-3">
                                    <span class="text-xl">▶️</span>
                                    <span class="text-xs font-semibold truncate">${canal.name}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    container.innerHTML = `<p class="text-sm text-zinc-500">Nenhum canal encontrado nesta categoria.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p class="text-sm text-red-500">Erro ao obter os canais.</p>`;
            }
        }

        function reproduzirCanal(streamId, nomeCanal) {
            const streamUrl = `${urlServidor}/live/${username}/${password}/${streamId}.m3u8`;
            const container = document.getElementById('playerContainer');
            
            container.innerHTML = `
                <h3 class="text-md font-bold text-white">A reproduzir: ${nomeCanal}</h3>
                <video controls autoplay class="w-full max-h-80 rounded-xl border border-zinc-800 bg-black shadow-lg">
                    <source src="${streamUrl}" type="application/x-mpegURL">
                    O seu navegador não suporta reprodução HLS nativa.
                </video>
                <button onclick="initApp()" class="text-xs text-blue-400 underline mt-2">Voltar às categorias</button>
            `;
        }

        function sairPlayer() {
            localStorage.clear();
            window.location.href = 'index.html';
        }

        window.onload = initApp;
    </script>
</body>
</html>
